<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocusFlow Mini Timer</title>
    <style>
      /* 이 창은 앱 번들의 CSS를 한 줄도 읽지 않는 독립 페이지다 — 그래서
         @font-face도 여기 한 번 더 있어야 한다. 여기에 폰트 링크가 아예
         없어서, 미니 타이머는 온라인이어도 Inter를 받은 적이 없다. */
      @font-face {
        font-family: "Pretendard";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/Pretendard-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Pretendard";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/Pretendard-SemiBold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Pretendard";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/Pretendard-Bold.woff2") format("woff2");
      }

      :root {
        color-scheme: light;
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui,
          "Segoe UI", sans-serif;

        /* 이 창은 앱의 CSS를 한 줄도 읽지 않으므로 자도 여기 한 벌 있어야 한다.
           값은 01-base.css의 것과 같고, 이름도 같게 두었다 — 두 곳을 나란히 놓고
           읽는 사람이 같은 낱말을 보게 하려는 것이다. `src/styles/scale.test.ts`는
           `src/styles/*.css`만 읽으므로 이 파일은 그 자가 닿지 않는 곳에 있다.
           (같은 창의 React 구현은 09-calendar-redesign.css가 그리고, 그쪽은 닿는다.) */
        --radius-sm: 4px;
        --type-md: 13px;
        --display-lg: 48px;
        --weight-bold: 700;
        --shadow-panel: 0 2px 8px rgba(0, 0, 0, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 280px;
        overflow: hidden;
        background: #f5f7fb;
        color: #111827;
      }

      main {
        width: 100vw;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      section {
        width: min(100%, 288px);
        display: grid;
        gap: 14px;
        padding: 18px;
        border: 1px solid #e5e7eb;
        border-radius: var(--radius-sm);
        background: #fff;
        box-shadow: var(--shadow-panel);
        text-align: center;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #6b7280;
        font-size: var(--type-md);
        font-weight: var(--weight-bold);
      }

      #close {
        width: 30px;
        min-height: 30px;
        border-radius: var(--radius-sm);
        color: #6b7280;
      }

      #time {
        font-size: var(--display-lg);
        line-height: 1;
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
      }

      #title {
        min-height: 24px;
        overflow-wrap: anywhere;
        font-weight: var(--weight-bold);
      }

      #status {
        color: #6b7280;
        font-size: var(--type-md);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        min-height: 40px;
        border: 1px solid #dbe4ff;
        border-radius: var(--radius-sm);
        background: #fff;
        color: #4f73ff;
        font-weight: var(--weight-bold);
        cursor: pointer;
      }

      button.danger {
        border-color: #ffd1cc;
        color: #b42318;
        background: #fff7f6;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <header>
          <span>FocusFlow</span>
          <button type="button" id="close" aria-label="Close">x</button>
        </header>
        <div id="time">--:--</div>
        <div id="title">Loading focus session</div>
        <div id="status">Connecting</div>
        <div class="actions">
          <button type="button" id="toggle" disabled>Pause</button>
          <button type="button" id="finish" class="danger" disabled>Finish</button>
        </div>
      </section>
    </main>

    <script>
      let snapshot = null;

      function getTauri() {
        return window.__TAURI__;
      }

      function render(next) {
        snapshot = next && next.sessionId ? next : null;
        const hasSession = Boolean(snapshot);
        const paused = snapshot && snapshot.status === "paused";

        document.getElementById("time").textContent = snapshot ? snapshot.time : "--:--";
        document.getElementById("title").textContent = snapshot ? snapshot.title || "Focus session" : "No active focus session";
        document.getElementById("status").textContent = hasSession ? (paused ? "Paused" : "Running") : "Idle";
        document.getElementById("toggle").textContent = paused ? "Resume" : "Pause";
        document.getElementById("toggle").disabled = !hasSession;
        document.getElementById("finish").disabled = !hasSession;
      }

      async function dispatch(action) {
        if (!snapshot || !getTauri()) return;
        await getTauri().core.invoke("dispatch_focus_tray_action", {
          action,
          sessionId: snapshot.sessionId
        });
      }

      async function boot() {
        const tauri = getTauri();
        if (!tauri) {
          document.getElementById("title").textContent = "Tauri API unavailable";
          document.getElementById("status").textContent = "Error";
          return;
        }

        render(await tauri.core.invoke("get_focus_tray_snapshot"));
        await tauri.event.listen("focus-tray-update", function(event) {
          render(event.payload);
        });
      }

      document.getElementById("toggle").addEventListener("click", function() {
        dispatch(snapshot && snapshot.status === "paused" ? "resume" : "pause");
      });
      document.getElementById("finish").addEventListener("click", function() {
        dispatch("finish");
      });
      document.getElementById("close").addEventListener("click", function() {
        var tauri = getTauri();
        if (tauri) {
          tauri.core.invoke("close_focus_mini_timer").catch(function() { window.close(); });
        } else {
          window.close();
        }
      });

      boot().catch(function(error) {
        document.getElementById("title").textContent = error && error.message ? error.message : "Mini timer failed";
        document.getElementById("status").textContent = "Error";
      });
    </script>
  </body>
</html>
