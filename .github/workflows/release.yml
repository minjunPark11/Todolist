name: Release

# Push a version tag (e.g. v0.1.2) to build, sign, and publish a release
# with auto-update artifacts (latest.json + signed installers) for Windows + macOS.
#
# Can also be started by hand from the Actions tab — pick the branch to release
# from and pass the tag to cut. tauri-action creates the tag on that commit, so
# no local tag push is needed. (For the manual trigger to appear at all, this
# file must also exist on the repository's default branch.)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.4.0)"
        required: true
        type: string

jobs:
  # A tag can be cut from any commit, including one that never went through a
  # PR, so the release re-runs the gate rather than trusting that it already
  # passed. It is one ubuntu job against two platform builds — cheap insurance
  # against publishing a broken auto-update to every installed client.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal build (Intel + Apple Silicon in one .app)
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the frontend at build time (npm run build → Vite).
          # anon key is public-safe to embed in the client bundle.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "FocusFlow ${{ inputs.tag || github.ref_name }}"
          releaseBody: "자동 업데이트로 배포됩니다. 앱을 실행하면 새 버전을 안내해요."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
